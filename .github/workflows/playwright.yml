name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Never click Buy from CI: @creates-order tests place real orders on production.
      RUN_ORDERS: '0'
      # Test account, set in Settings → Secrets and variables → Actions.
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
      TEST_ZONE_ID: ${{ secrets.TEST_ZONE_ID }}
      TEST_NICKNAME: ${{ secrets.TEST_NICKNAME }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test --project=chromium --workers=1
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
